{% extends "base.html" %}
{% block title %}Create Account — CloudGuard Security Operations{% endblock %}
{% block content %}
<div class="max-w-md mx-auto my-12">
    <div class="glass-card">
        <div class="text-center mb-6">
            <div class="logo-shield w-14 h-14 mx-auto mb-3 text-2xl font-bold">
                <i class="fa-solid fa-user-plus"></i>
            </div>
            <h2 class="text-2xl font-extrabold uppercase font-mono tracking-tight">Register Operator</h2>
            <p class="text-xs opacity-75 font-mono mt-1">// PROVISION_RBAC_ACCOUNT</p>
        </div>

        <form action="{{ url_for('auth.register') }}" method="POST" class="space-y-4">
            <div class="form-group">
                <label class="form-label">
                    <i class="fa-solid fa-envelope mr-1"></i> Operator Email
                </label>
                <input type="email" name="email" class="form-control" placeholder="analyst@cloudguard.com" required autofocus>
            </div>

            <div class="form-group">
                <label class="form-label">
                    <i class="fa-solid fa-lock mr-1"></i> Set Passphrase
                </label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>

            <div class="form-group">
                <label class="form-label">
                    <i class="fa-solid fa-shield mr-1"></i> Access Role (RBAC)
                </label>
                <select name="role" class="form-control">
                    <option value="analyst" selected>Security Analyst (Upload & Scan)</option>
                    <option value="viewer">Auditor / Viewer (Read Only)</option>
                    <option value="admin">Platform Admin (Full Privileges)</option>
                </select>
            </div>

            <button type="submit" class="btn-action btn-azure w-full justify-center py-3">
                <i class="fa-solid fa-user-check"></i> Provision Account &rarr;
            </button>
        </form>

        <div class="text-center mt-6 text-xs font-mono">
            EXISTING USER? <a href="{{ url_for('auth.login') }}" class="font-bold underline" style="color: var(--accent-primary);">SIGN IN</a>
        </div>
    </div>
</div>
{% endblock %}
