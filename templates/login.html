{% extends "base.html" %}
{% block title %}Sign In — CloudGuard Security Operations{% endblock %}
{% block content %}
<div class="max-w-md mx-auto my-4 sm:my-8 px-2 sm:px-0">
    <div class="bg-surface-container border-2 border-outline p-5 sm:p-8">
        <div class="text-center mb-6 border-b-2 border-outline pb-5">
            <div class="w-14 h-14 mx-auto mb-3 bg-primary text-black dark:text-white border-2 border-outline dark:border-primary flex items-center justify-center text-2xl font-bold">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <h2 class="font-headline text-xl sm:text-2xl font-black uppercase tracking-tight text-on-surface">Identity Authentication</h2>
            <p class="font-mono text-xs text-secondary font-bold mt-1">// CIS_OPS_TERMINAL_ACCESS</p>
        </div>

        <form action="{{ url_for('auth.login') }}" method="POST" class="space-y-4">
            <div>
                <label class="block font-mono text-xs font-bold uppercase tracking-wider text-on-surface-variant mb-1.5">
                    <i class="fa-solid fa-envelope mr-1 text-secondary"></i> Identity Email
                </label>
                <input type="email" id="emailInput" name="email" class="w-full px-3.5 py-2.5 bg-surface-container-lowest border-2 border-outline text-on-surface font-mono text-sm focus:border-secondary focus:ring-0 focus:outline-none placeholder:text-on-surface-variant/50" placeholder="admin@cloudguard.com" required autofocus>
            </div>

            <div>
                <label class="block font-mono text-xs font-bold uppercase tracking-wider text-on-surface-variant mb-1.5">
                    <i class="fa-solid fa-lock mr-1 text-secondary"></i> Passphrase
                </label>
                <input type="password" id="passwordInput" name="password" class="w-full px-3.5 py-2.5 bg-surface-container-lowest border-2 border-outline text-on-surface font-mono text-sm focus:border-secondary focus:ring-0 focus:outline-none placeholder:text-on-surface-variant/50" placeholder="••••••••" required>
            </div>

            <button type="submit" class="w-full py-3 px-4 bg-primary hover:bg-primary/90 text-black dark:text-white font-headline font-black text-sm uppercase tracking-wider border-2 border-outline dark:border-primary transition-all flex items-center justify-center gap-2 cursor-pointer">
                <i class="fa-solid fa-right-to-bracket"></i>
                <span>Authenticate &rarr;</span>
            </button>
        </form>

        <div class="text-center mt-6 pt-4 border-t border-outline font-mono text-xs text-on-surface-variant">
            NEW ANALYST?
            <a href="{{ url_for('auth.register') }}" class="font-black underline text-[#e11d48] dark:text-primary ml-1">REGISTER ACCOUNT</a>
        </div>

        <!-- 1-Click Demo Credentials Box -->
        <div class="mt-5 p-3.5 border-2 border-outline bg-surface-container-low">
            <div class="flex items-center justify-between mb-2 pb-1.5 border-b border-outline">
                <span class="font-mono text-xs font-black uppercase text-on-surface flex items-center gap-1.5">
                    <i class="fa-solid fa-key text-tertiary"></i> PERSISTENT DEMO ACCOUNTS
                </span>
                <span class="font-mono text-[10px] text-secondary font-bold uppercase">PRE-SEEDED</span>
            </div>
            <div class="grid grid-cols-3 gap-1.5">
                <button type="button" class="font-mono text-[11px] font-bold uppercase px-2 py-1.5 bg-surface-container hover:bg-primary hover:text-black text-on-surface border border-outline transition-all cursor-pointer text-center" onclick="fillCreds('admin@cloudguard.com', 'Admin@123')">
                    Admin
                </button>
                <button type="button" class="font-mono text-[11px] font-bold uppercase px-2 py-1.5 bg-surface-container hover:bg-primary hover:text-black text-on-surface border border-outline transition-all cursor-pointer text-center" onclick="fillCreds('analyst@cloudguard.com', 'Analyst@123')">
                    Analyst
                </button>
                <button type="button" class="font-mono text-[11px] font-bold uppercase px-2 py-1.5 bg-surface-container hover:bg-primary hover:text-black text-on-surface border border-outline transition-all cursor-pointer text-center" onclick="fillCreds('viewer@cloudguard.com', 'Viewer@123')">
                    Viewer
                </button>
            </div>
            <p class="font-mono text-[10px] text-on-surface-variant mt-2 text-center">
                Always active &bull; Password: <span class="text-on-surface font-bold">&lt;Role&gt;@123</span>
            </p>
        </div>
    </div>
</div>

<script>
function fillCreds(email, pw) {
    document.getElementById('emailInput').value = email;
    document.getElementById('passwordInput').value = pw;
}
</script>
{% endblock %}
