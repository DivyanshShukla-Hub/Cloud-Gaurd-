{% extends "base.html" %}
{% block title %}Sign In — CloudGuard Security Operations{% endblock %}
{% block content %}
<div class="max-w-md mx-auto my-12">
    <div class="glass-card">
        <div class="text-center mb-6">
            <div class="logo-shield w-14 h-14 mx-auto mb-3 text-2xl font-bold">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <h2 class="text-2xl font-extrabold uppercase font-mono tracking-tight">Identity Authentication</h2>
            <p class="text-xs opacity-75 font-mono mt-1">// CIS_OPS_TERMINAL_ACCESS</p>
        </div>

        <form action="{{ url_for('auth.login') }}" method="POST" class="space-y-4">
            <div class="form-group">
                <label class="form-label">
                    <i class="fa-solid fa-envelope mr-1"></i> Identity Email
                </label>
                <input type="email" id="emailInput" name="email" class="form-control" placeholder="admin@cloudguard.com" required autofocus>
            </div>

            <div class="form-group">
                <label class="form-label">
                    <i class="fa-solid fa-lock mr-1"></i> Passphrase
                </label>
                <input type="password" id="passwordInput" name="password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-action btn-azure w-full justify-center py-3">
                <i class="fa-solid fa-right-to-bracket"></i> Authenticate &rarr;
            </button>
        </form>

        <div class="text-center mt-6 text-xs font-mono">
            NEW ANALYST? <a href="{{ url_for('auth.register') }}" class="font-bold underline" style="color: var(--accent-primary);">REGISTER ACCOUNT</a>
        </div>

        <!-- 1-Click Demo Credentials Pill -->
        <div class="mt-6 p-3 border-2 border-boundary bg-surface-subtle">
            <div class="flex justify-between items-center mb-2">
                <span class="font-mono text-xs font-bold uppercase">
                    <i class="fa-solid fa-key mr-1"></i> ROOT ADMIN TEST
                </span>
                <button type="button" class="btn-action btn-ghost text-xs py-1 px-2" onclick="fillCreds('admin@cloudguard.com', 'Admin@123')">
                    Autofill
                </button>
            </div>
            <div class="font-mono text-xs opacity-75">
                user: admin@cloudguard.com<br>
                pass: Admin@123
            </div>
        </div>
    </div>
</div>

<script>
function fillCreds(email, pw) {
    document.getElementById('emailInput').value = email;
    document.getElementById('passwordInput').value = pw;
}
</script>
{% endblock %}
